name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Princípio do menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: guardrail de segurança. Nada mais roda se um segredo/artefato estiver versionado.
  # ---------------------------------------------------------------------------
  secret-guard:
    name: Guardrail de segurança (segredos e artefatos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: um segredo apagado depois do commit continua vazado

      - name: Falhar se .pfx/.p12/.pem/.key/.env estiverem versionados
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|/)(\.env(\.[^/]*)?|[^/]*\.(pfx|p12|pem|key))$'
          allowed='(^|/)\.env\.example$'

          tracked="$(git ls-files | grep -Ei "$pattern" | grep -Eiv "$allowed" || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Arquivos sensíveis versionados na árvore atual:"
            echo "$tracked"
            exit 1
          fi

          history="$(git log --all --name-only --pretty=format: --diff-filter=A | sort -u | grep -Ei "$pattern" | grep -Eiv "$allowed" || true)"
          if [ -n "$history" ]; then
            echo "::error::Arquivos sensíveis já foram commitados no histórico (revogue/troque o segredo e reescreva o histórico):"
            echo "$history"
            exit 1
          fi
          echo "Nenhum arquivo sensível versionado (árvore e histórico)."

      - name: Falhar se houver chave privada ou PFX em Base64 dentro de arquivos versionados
        shell: bash
        run: |
          set -euo pipefail
          # O marcador é montado em partes para este próprio arquivo não ser detectado.
          marker='-----BEGIN'
          if git grep -nE -e "${marker} [A-Z ]*PRIVATE KEY" -- . ; then
            echo "::error::Chave privada encontrada em arquivo versionado."
            exit 1
          fi
          if git grep -nE -e 'SIGNING_PFX_BASE64=[A-Za-z0-9+/]{100,}' -- . ; then
            echo "::error::Certificado A1 em Base64 encontrado em arquivo versionado."
            exit 1
          fi
          echo "Nenhum segredo embutido encontrado."

  # ---------------------------------------------------------------------------
  # Job 2: backend. Lint, testes e smokes com certificado EFÊMERO, sem depender de segredos.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, testes, smokes efêmeros e docker build)
    runs-on: ubuntu-latest
    needs: secret-guard
    timeout-minutes: 25
    env:
      # Valores fictícios e não secretos: os smokes 2, 3 e 6 e os testes não tocam banco nem bucket.
      APP_ENV: development
      PUBLIC_VALIDATION_BASE_URL: http://localhost:3000/validar
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DB_SSL: disable
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_BUCKET: certificados
      ISSUANCE_API_KEY: ci-only-key-0123456789-0123456789-0123456789
      CORS_ORIGINS: http://localhost:3000,https://validar.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes unitários e de integração em memória (pytest)
        run: pytest

      - name: Gerar certificado A1 efêmero (somente em memória do runner)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_dev_cert.py | while IFS= read -r line; do
            name="${line%%=*}"
            value="${line#*=}"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
          echo "Certificado efêmero exportado (mascarado) para os próximos passos."

      - name: Smoke Etapa 2 (carregar PKCS#12 e assinar PAdES)
        run: python scripts/smoke_step2.py

      - name: Smoke Etapa 3 (renderizar, QR Code e assinar, zero disco)
        run: python scripts/smoke_step3.py

      - name: Smoke Etapa 6 (auditoria do repositório, healthcheck e CORS)
        run: python scripts/smoke_step6.py

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: certificados-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar a imagem (usuário não-root, filesystem somente leitura, import da aplicação)
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid \
            -e APP_ENV -e PUBLIC_VALIDATION_BASE_URL -e DATABASE_URL -e DB_SSL \
            -e S3_ENDPOINT_URL -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e S3_BUCKET \
            -e SIGNING_PFX_BASE64 -e SIGNING_PFX_PASSWORD -e ISSUANCE_API_KEY -e CORS_ORIGINS \
            certificados-api:ci \
            python -c "import os, app.main; assert os.getuid() != 0, 'rodando como root'; print('imagem OK (uid=%d)' % os.getuid())"

  # ---------------------------------------------------------------------------
  # Job 3: portal Next.js (typecheck + build de produção).
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck e build)
    runs-on: ubuntu-latest
    needs: secret-guard
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build de produção
        run: npm run build
