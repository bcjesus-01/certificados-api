# Conjunto explícito de regras: o CI não muda de comportamento quando o ruff alterar seus padrões.
target-version = "py311"
line-length = 120
extend-exclude = ["frontend"]

[lint]
# E4/E7/E9: erros de sintaxe e imports; F: pyflakes (imports/variáveis não usados, nomes indefinidos).
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Scripts e testes ajustam sys.path antes de importar o pacote "app".
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
